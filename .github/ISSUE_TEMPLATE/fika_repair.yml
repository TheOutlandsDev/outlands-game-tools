name: Fika repair bug or suggestion
description: Report a repair/restore issue or propose an improvement using fictional examples.
title: "[Fika repair]: "
body:
  - type: markdown
    attributes:
      value: |
        Feedback, documentation fixes and simpler approaches are welcome.
        Do not upload real profiles, backups, manifests, raw console output, addresses or credentials.
        This is an independent wrapper; gameplay and multiplayer compatibility are unverified.
  - type: dropdown
    id: kind
    attributes:
      label: What would you like to share?
      options:
        - Bug report
        - Improvement or suggestion
        - Documentation or compatibility question
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Versions and selected command
      description: Include Windows/PowerShell/SPT/Fika versions where relevant, without personal paths or profile IDs.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or useful improvement
      description: Explain expected and observed behavior, or the task you want made easier.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Fictional reproduction or proposed example
      description: Prefer Create-FikaRepairDemo.ps1 with made-up values. Small invented snippets are welcome.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report check
      options:
        - label: I excluded real profiles, private addresses and paths, credentials, recovery manifests and backup contents.
          required: true
