name: File Audit app
description: Report a reproducible File Audit problem or suggest an improvement.
title: "[File Audit]: "
body:
  - type: markdown
    attributes:
      value: |
        Public feedback is welcome. Use fictional input names/content and small
        generated examples. Do not attach actual private inventories, filenames,
        document contents, credentials or machine-specific paths.
  - type: input
    id: versions
    attributes:
      label: OS and JDK version
      placeholder: Windows, JDK 17
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, limits and fictional folder layout
      description: Include GUI/CLI mode, extension filters, hash/metadata-only choice and relevant scan limits.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: A small fictional report excerpt is useful. Indicate partial/cancelled status and native test skips if relevant.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Improvement or accessibility feedback
      description: No code contribution is required to suggest a useful change.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report check
      options:
        - label: I removed real private paths, inventories, document content, credentials and identifying information.
          required: true
