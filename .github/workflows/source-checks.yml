name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify source inventory
        run: python -B tools/verify_source_release.py
      - name: Check publication gate failure cases
        run: python -B -m unittest discover -s tools/tests -v
      - name: Check folder inventory utility
        working-directory: tools/game-tree-exporter
        run: python -B -m unittest discover -s tests -v
      - name: Check MO2 conflict inspector with synthetic profiles
        working-directory: tools/mo2-conflict-inspector
        run: python -B -m unittest discover -s tests -v
      - name: Check diagnostics summarizer
        run: ./spt/CodexDiagnostics/tests/Test-Summary.ps1
      - name: Check telemetry summarizer
        run: ./spt/QuakeBrain/tests/Test-Summary.ps1
      - name: Check console request policy
        run: ./spt/ScavLifeConsole/Test-ConsoleSecurity.ps1
      - name: Check Fika wrappers with synthetic files
        run: ./spt/FikaHeadless/Test-FikaHeadless.ps1
      - name: Check process observer with synthetic processes
        run: ./tools/process-exit-observer/tests/Test-Observer.ps1 -PythonPath (Get-Command python.exe).Source
      - name: Check dashboard JavaScript
        run: node --check ./spt/ScavLifeConsole/www/app.js
      - name: Build and verify the complete reviewed source archive
        shell: pwsh
        run: |
          python -B tools/source-release-builder/source_release.py --source-root . --prefix outlands-game-tools-source --output (Join-Path $env:RUNNER_TEMP 'outlands-game-tools-source-check.zip')
  mo2-portability:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check MO2 conflict inspector with synthetic profiles
        working-directory: tools/mo2-conflict-inspector
        run: python -B -m unittest discover -s tests -v
  lua-portability:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed Lua parser dependency
        working-directory: tools/lua-syntax-checker
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Require all three reviewed Lua runtime modules
        run: python -c "import lupa, lupa.luajit21, lupa.lua51, lupa.lua54; assert lupa.__version__ == '2.8'"
      - name: Check Lua syntax checker with synthetic sources
        working-directory: tools/lua-syntax-checker
        run: python -B -m unittest discover -s tests -v
  audio-portability:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed audio decoder dependencies
        working-directory: tools/audio-integrity-checker
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Require reviewed dependencies and native codecs
        run: python -c "import soundfile as sf, numpy as np; assert sf.__version__ == '0.13.1'; assert np.__version__ == '2.2.6'; assert sf.check_format('OGG', 'VORBIS'); assert sf.check_format('FLAC', 'PCM_16')"
      - name: Check audio inspector with generated audio and profiles
        working-directory: tools/audio-integrity-checker
        run: python -B -m unittest discover -s tests -v
  standalone-portability:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check Save Snapshot Verifier with generated files
        working-directory: tools/save-snapshot-verifier
        run: python -B -m unittest discover -s tests -v
      - name: Check MO2 Baseline Profile Builder with synthetic profiles
        working-directory: tools/mo2-profile-builder
        run: python -B -m unittest discover -s tests -v
      - name: Check X-Ray Log Summary with generated logs
        working-directory: tools/xray-log-summary
        run: python -B -m unittest discover -s tests -v
      - name: Check LTX Definition Inspector with generated configurations
        working-directory: tools/ltx-definition-inspector
        run: python -B -m unittest discover -s tests -v
      - name: Check Mod Content Manifest and Diff with synthetic content
        working-directory: tools/mod-content-manifest
        run: python -B -m unittest discover -s tests -v
      - name: Check Source Release Builder with generated manifests
        working-directory: tools/source-release-builder
        run: python -B -m unittest discover -s tests -v
      - name: Check Mod Asset Reference Checker with original synthetic files
        working-directory: tools/mod-asset-reference-checker
        run: python -B -m unittest discover -s tests -v
      - name: Check INI and LTX Configuration Value Diff with original file pairs
        working-directory: tools/ini-ltx-value-diff
        run: python -B -m unittest discover -s tests -v
      - name: Check Unreal PAK Inspector with original generated archives
        working-directory: tools/unreal-pak-inspector
        run: python -B -m unittest discover -s tests -v
      - name: Check Mod Package ZIP Inspector with original generated archives
        working-directory: tools/mod-package-zip-inspector
        run: python -B -m unittest discover -s tests -v
      - name: Check MO2 Profile Change Report with fictional saved modlists
        working-directory: tools/mo2-profile-change-report
        run: python -B -m unittest discover -s tests -v
      - name: Check Offline Mod Dependency Rules with fictional inventories and graphs
        working-directory: tools/offline-mod-dependency-checker
        run: python -B -m unittest discover -s tests -v
      - name: Check Game Session Evidence Auditor with original fictional captures
        working-directory: tools/game-session-evidence-auditor
        run: python -B -m unittest discover -s tests -v
      - name: Check Bounded Evidence Manifest Verifier and explicit platform refusal
        working-directory: tools/bounded-evidence-manifest-verifier
        run: python -B -m unittest discover -s tests -v
      - name: Check DayZ numeric library with fictional in-memory inputs
        working-directory: tools/dayz-market-numeric-diff
        run: python -B -m unittest -v test_numeric_delta
      - name: Check fictional numeric library example
        run: python -B tools/dayz-market-numeric-diff/examples/demo.py
      - name: Install reviewed webcam diagnostic dependencies
        run: python -m pip install --only-binary=:all: -r tools/webcam-diagnostic/requirements.txt
      - name: Check webcam app with synthetic captures and Windows Tk
        if: runner.os == 'Windows'
        working-directory: tools/webcam-diagnostic
        env:
          WEBCAM_REQUIRE_TK: '1'
        run: python -B -m unittest discover -s tests -v
      - name: Check webcam app with synthetic captures and Ubuntu Tk
        if: runner.os == 'Linux'
        working-directory: tools/webcam-diagnostic
        env:
          WEBCAM_REQUIRE_TK: '1'
        run: xvfb-run -a python -B -m unittest discover -s tests -v
  assembly-portability:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
          skip-lts-prepass: true
      - name: Check static assembly inspector with original synthetic assemblies
        run: python -B -m unittest discover -s tools/dotnet-assembly-inspector/tests -v
  xml-portability:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - name: Require supported XML parser version
        run: python -c "import xml.parsers.expat as expat; print(expat.EXPAT_VERSION); assert expat.version_info >= (2, 7, 2)"
      - name: Check XML Mod Configuration Diff with synthetic XML
        working-directory: tools/xml-config-diff
        run: python -B -m unittest discover -s tests -v
